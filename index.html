<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EDEFF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zyklus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Zyklus</title>
<style>
:root{
  --ink:#3B2350; --soft:#6A5380; --line:rgba(59,35,80,.14); --card:rgba(255,255,255,.72);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --bg1:#D4F2E4; --bg2:#F5FBF2; --blob:#BFEBD5; --accent:#27805F; --accent2:#4FB58F;
}
body[data-phase=bleed]{--bg1:#FFD9E3;--bg2:#FFF3F0;--blob:#FFB5C9;--accent:#C92C5C;--accent2:#EE6A8F}
body[data-phase=fol]{--bg1:#D4F2E4;--bg2:#F5FBF2;--blob:#BFEBD5;--accent:#27805F;--accent2:#4FB58F}
body[data-phase=fert]{--bg1:#E6D6FF;--bg2:#FFE9F5;--blob:#D8B8FF;--accent:#7A3FE0;--accent2:#C766E0}
body[data-phase=man]{--bg1:#D3ECF5;--bg2:#F1F8F6;--blob:#B5DDEB;--accent:#1F7A8C;--accent2:#3FA7A0}
body[data-phase=lut]{--bg1:#DBE2FB;--bg2:#F4EFFB;--blob:#C3CDF5;--accent:#5A6BC8;--accent2:#8E9CE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg2)}
body{margin:0;min-height:100dvh;color:var(--ink);font:17px/1.45 var(--sans);background:linear-gradient(175deg,var(--bg1),var(--bg2) 62%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;background:var(--blob);filter:blur(60px);opacity:.6;pointer-events:none}
body::before{width:300px;height:300px;top:-90px;right:-110px;animation:drift 19s ease-in-out infinite alternate}
body::after{width:260px;height:260px;bottom:40px;left:-120px;animation:drift 23s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(46px,70px) scale(1.18)}}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.defs{position:absolute;width:0;height:0}

.wrap{max-width:560px;margin:0 auto;padding:calc(var(--top) + 14px) 20px calc(var(--bot) + 118px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top h1{font:italic 400 29px/1.1 var(--serif)}
.lockb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.lockb svg{width:20px;height:20px}
.link{color:var(--soft);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 2px}
.muted{color:var(--soft)}
.small{font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 20px;border-radius:27px;font-weight:600;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.line{background:var(--card);color:var(--ink)}
.btn.danger{background:none;color:#A81C49;box-shadow:inset 0 0 0 1.5px #A81C49}
.btn.full{width:100%}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Blüte */
.hero{text-align:center;margin-bottom:18px}
.bloomwrap{max-width:360px;margin:0 auto}
svg.fl{display:block;width:100%;height:auto;overflow:visible}
.p{stroke:rgba(255,255,255,.85);stroke-width:1.3;transform-origin:180px 180px;cursor:pointer;transition:opacity .15s}
.p:active{opacity:.7}
.p:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.b-stark{fill:url(#g-stark)} .b-mittel{fill:url(#g-mittel)} .b-leicht{fill:url(#g-leicht)} .b-spot{fill:url(#g-spot)}
.fertile{fill:url(#g-fert)} .fol{fill:url(#g-fol)} .lut{fill:url(#g-lut)}
.plan{fill:url(#g-plan);stroke:#9D74EA;stroke-width:1.4}
.fut{fill:rgba(255,255,255,.62);stroke:rgba(59,35,80,.16)}
.p.today{stroke:var(--ink);stroke-width:2.6;animation:breathe 3.4s ease-in-out infinite}
.fl.bloom .p{animation:bloom .75s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*24ms)}
.fl.bloom .p.today{animation:bloom .75s cubic-bezier(.2,.9,.3,1.15) both,breathe 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*24ms),1.2s}
.fl.bloom .mk{animation:fadein .4s both;animation-delay:calc(var(--i)*24ms + .5s)}
@keyframes bloom{from{transform:scale(.25) rotate(-14deg);opacity:0}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes fadein{from{opacity:0}}
.mk{pointer-events:none}
.ct1{font:15px var(--sans);fill:var(--soft);text-anchor:middle}
.ct2{font:400 54px var(--serif);fill:var(--ink);text-anchor:middle}
.hero h2{font:400 31px/1.15 var(--serif);margin-top:14px}
.hero p{margin:8px auto 0;max-width:330px;color:var(--soft);font-size:16px}
.acts{display:flex;gap:10px;margin-bottom:10px}
.acts .btn{flex:1;padding:0 8px;font-size:16px}
.timerb{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;color:var(--soft);font-size:16px;text-decoration:underline;text-underline-offset:3px}
.timerb[disabled]{opacity:.5;text-decoration:none}
.keys{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:14px;color:var(--soft)}
.keys li{display:flex;align-items:center;gap:6px}
.keys i{width:12px;height:12px;border-radius:50%;display:block}
.phases{list-style:none;margin:16px 0 0;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:22px}
.ph{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:18px;font-size:13px;color:var(--soft);line-height:1.15}
.ph i{width:18px;height:18px;border-radius:50%;display:block}
.ph.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 3px 12px rgba(59,35,80,.12)}
.ph-bleed i{background:linear-gradient(#F57C9B,#D93A68)}.ph-fol i{background:linear-gradient(#BDE6CF,#5FB795)}.ph-fert i{background:linear-gradient(#D27BEA,#7A3FE0)}.ph-lut i{background:linear-gradient(#C1C9F2,#7F8FDB)}
.roles{display:grid;gap:10px;margin-bottom:22px}
.roles button{display:grid;grid-template-columns:auto 1fr;column-gap:12px;text-align:left;background:rgba(255,255,255,.12);border-radius:20px;padding:14px 16px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.roles button span{grid-row:span 2;font-size:30px;align-self:center}
.roles button small{color:#E8DAF5;font-size:14px}
.roles button[aria-checked=true]{background:#fff;color:#4A2675;box-shadow:none}
.roles button[aria-checked=true] small{color:#6A5380}
.mhero{position:relative;max-width:260px;margin:4px auto 0}
.ring{display:block;width:100%;height:auto}
.mring{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 46px}
.mring b{font:400 64px/1 var(--serif)}
.mring span{font-size:14px;color:var(--soft);margin-top:4px}
.mintro{text-align:center;color:var(--soft);font-size:15px;max-width:340px;margin:12px auto 18px}
.mcard{background:var(--card);border-radius:24px;padding:14px 16px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mh h2{font:italic 400 24px var(--serif)}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;min-height:52px;border-top:1px solid var(--line)}
.chk .ce{font-size:20px}
.chk.on .tick{background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:none}
.week{list-style:none;margin:12px 0 2px;padding:0;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--soft)}
.week i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--line) 0)}
.week i.full{background:linear-gradient(120deg,var(--accent),var(--accent2))}
.supp{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}
.supp+form,.f>p+form{margin-top:10px}
.folic{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:18px;background:var(--card);border-radius:24px;padding:14px 18px;min-height:64px}
.folic b{display:block}
.folic .small{display:block}
.tick{width:30px;height:30px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;transition:background .15s}
.folic.on .tick{background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:none}
.cmp{background:var(--card);border-radius:22px;padding:10px;margin-bottom:12px;display:grid;gap:6px}
.cmpr{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:14px;color:var(--soft)}
.cmpr img{width:100%;height:46px;object-fit:cover;border-radius:10px;background:var(--line)}
.doc{background:#fff;border-radius:20px;padding:16px}
.doc dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0 0 16px}
.doc dt{color:var(--soft)}
.doc dd{margin:0;font-weight:600;text-align:right}
.doc table{width:100%;border-collapse:collapse;font-size:15px}
.doc th{text-align:left;color:var(--soft);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.doc td{padding:7px 4px;border-bottom:1px solid var(--line)}
@media print{
  body{background:#fff}body::before,body::after{display:none}
  #app,#timer,.back,.tabs,.noprint,.sh .link{display:none!important}
  .sheet{position:static;max-height:none;overflow:visible;background:#fff;border-radius:0;padding:0;animation:none}
  .doc{padding:0}
}
.rg{padding-bottom:12px}
.hs{display:block;width:100%;height:auto}
.rgbig{position:relative;padding:22px 0 34px}
.rglab span{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:700;text-align:center;line-height:1.1;white-space:nowrap}
.rglab span{top:calc(100% - 32px)}
.rglab.up span{top:0}
.rglab small{display:block;font-weight:400;color:var(--soft);font-size:11px}
.rgex{display:grid;grid-template-columns:70px 1fr;column-gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rgex b{font-size:15px}.rgex b.positiv{color:#7A3FE0}.rgex b.ungueltig{color:#A81C49}
.rgex small{grid-column:2;color:var(--soft);font-size:13px;line-height:1.25;margin-top:2px}
.rgd{margin-bottom:16px}
.tcv{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.tcv b{font:400 40px/1 var(--serif)}
.tcv span{color:var(--soft);font-size:15px}
.sl{display:block;margin-top:12px}
.sl input{width:100%;margin:10px 0 2px;accent-color:#7A3FE0}
.slx{display:block;position:relative;height:20px;margin:0 2px}
.slx span{position:absolute;top:0;transform:translateX(-50%)}
.mhint{margin:4px 0 8px;font-size:15px}
.mbox{position:relative;border-radius:14px;overflow:hidden;background:var(--line);touch-action:manipulation}
.mimg{display:block;width:100%;height:auto;cursor:crosshair}
.mk2{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#7A3FE0;color:#fff;font:700 13px/26px var(--sans);text-align:center;font-style:normal;box-shadow:0 0 0 3px #fff}
.tcc{margin:0 0 14px;background:var(--card);border-radius:22px;padding:10px 10px 12px}
.tcc svg{display:block;width:100%;height:auto}
.tct{font:12px var(--sans);fill:var(--soft)}
.tcp{font-weight:700;fill:#7A3FE0;font-size:13px}
.tcc figcaption{font-size:13px;color:var(--soft);padding:2px 6px 0}
.tcb{font-size:14px;color:var(--soft);font-weight:600}
.cmpr small{display:block;font-size:12px;color:#7A3FE0;font-weight:600}
.tipcard{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;margin-top:18px;background:var(--card);border-radius:24px;padding:16px 18px}
.tipe{font-size:34px;line-height:1}
.tipcard b{display:block;font:italic 400 20px var(--serif);margin-bottom:3px}
.tipt{display:block;font-size:15px;color:var(--soft)}
.tipm{display:block;margin-top:8px;font-weight:600;color:var(--accent);font-size:15px}
.tipd{background:#fff;border-radius:20px;padding:2px 16px;margin-bottom:10px}
.tipd summary{min-height:54px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;list-style:none}
.tipd summary::-webkit-details-marker{display:none}
.tipd summary span{font-size:24px}
.tipd summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--soft)}
.tipd[open] summary::after{content:"–"}
.tipd ul{margin:0 0 14px;padding-left:20px}
.tipd li{margin-bottom:9px;font-size:16px}
.src{margin:6px 0 0;padding-left:20px;font-size:14px}
.src a{color:var(--soft)}
.mood{display:flex;gap:12px;align-items:center;text-align:left;max-width:360px;margin:12px auto 0;background:var(--card);border-radius:22px;padding:12px 16px}
.mood .emo{font-size:38px;line-height:1}
.mood b{font-weight:700}
.mood p{margin-top:3px;font-size:15px;color:var(--soft)}
.en{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.en i{width:14px;height:7px;border-radius:4px;background:var(--line);display:block}
.en i.f{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.p.est{opacity:.42}
.k-e{background:linear-gradient(90deg,#5FB795 50%,rgba(95,183,149,.4) 50%)}
.k-b{background:#E0446F}.k-t{background:#E8DCFF;box-shadow:inset 0 0 0 1.5px #9D74EA}.k-f{background:linear-gradient(#7A3FE0,#D27BEA)}.k-p{background:#FFC83D}
.chips{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips li{background:var(--card);padding:7px 14px;border-radius:18px;font-size:15px}
.soft{text-align:center;margin-top:18px;color:var(--soft);font-size:15px}

/* Kalender */
.mon{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mon h2{font:400 26px var(--serif)}
.nav{width:48px;height:48px;font-size:24px;border-radius:50%;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;background:var(--card);border-radius:26px;padding:14px 8px 8px}
.wd{text-align:center;font-size:13px;color:var(--soft);padding-bottom:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px;padding-top:2px}
.cell.other{visibility:hidden}
.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums}
.f-leicht{background:linear-gradient(#FBC1CF,#F08CA8)}
.f-mittel{background:linear-gradient(#F57C9B,#D93A68);color:#fff}
.f-stark{background:linear-gradient(#E8527F,#B0204F);color:#fff}
.f-spot{background:#FDE0E8}
.fertd{background:linear-gradient(140deg,#7A3FE0,#D27BEA);color:#fff;box-shadow:0 2px 12px rgba(122,63,224,.45)}
.dot.plan{background:#F1EAFF;box-shadow:inset 0 0 0 1.5px #9D74EA}
.dot.pred{background:#FFF0F4;box-shadow:inset 0 0 0 1.5px #EE8AA8}
.now{outline:2.5px solid var(--ink);outline-offset:1.5px}
.mks{height:14px;font-size:12px;line-height:14px;color:#D69A00}
.mks.n{color:var(--soft)}
.legend{list-style:none;margin:16px 4px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.legend .dot{width:20px;height:20px;flex:none}
.cm{display:flex;gap:2px;align-items:center;height:14px}
.cm .mks:empty{display:none}
.heart{color:#E0446F;font-size:13px;line-height:14px}
.legend .heart{width:20px;text-align:center;font-size:15px;flex:none}
.legend .mks{width:20px;text-align:center;font-size:15px;flex:none}

/* Tests */
.cyc{font:italic 400 22px var(--serif);margin:24px 0 10px}
.t{display:block;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:10px;margin-bottom:10px}
.t img{display:block;width:100%;height:116px;object-fit:cover;border-radius:15px;background:var(--line);margin-bottom:8px}
.t .m{display:flex;gap:12px;align-items:center;padding:2px 6px}
.t .m .strip{flex:none}
.t b.positiv{color:#7A3FE0}
.strip{display:block;width:15px;height:28px}

/* Verlauf */
.summary{font:400 25px/1.3 var(--serif);margin:8px 0 22px}
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.mini{text-align:center;font-size:15px;color:var(--soft)}
.mini svg{margin-bottom:4px}
.mini b{display:block;color:var(--ink);font-weight:600}
details#set{margin-top:30px;background:var(--card);border-radius:22px;padding:4px 16px}
details#set summary{font-weight:600;min-height:52px;display:flex;align-items:center;cursor:pointer;list-style:none}
details#set summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--soft)}
details#set[open] summary::after{content:"–"}
details#set summary::-webkit-details-marker{display:none}
.st{display:block;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line);min-height:50px}
.st small{display:block;color:var(--soft);font-size:14px}
label.f,div.f{display:block;margin-bottom:18px}
.f>span,.lab{display:block;font-weight:600;margin-bottom:7px}
input[type=password],input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:52px;border:0;border-radius:16px;background:#fff;padding:12px 14px;font-size:17px;-webkit-appearance:none;appearance:none}
textarea{min-height:92px;resize:vertical}

/* Sperre */
.gate{min-height:100dvh;background:linear-gradient(170deg,#2F1A4A,#5B2F8F 58%,#B9487F);color:#fff;padding:calc(var(--top) + 30px) 24px calc(var(--bot) + 32px)}
.gate .in{max-width:420px;margin:0 auto}
.gatefl{width:170px;margin:0 auto;animation:turn 90s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.gatefl .p{fill:rgba(255,255,255,.2);stroke:rgba(255,255,255,.5);cursor:default}
.gate h1{font:italic 400 52px/1 var(--serif);margin:18px 0 10px;text-align:center}
.gate p{color:#E8DAF5;margin-bottom:20px}
.gate h1+p{text-align:center}
.gate .f>span{color:#fff}
.gate input[type=password]{color:#3B2350;-webkit-text-fill-color:#3B2350;caret-color:#3B2350}
.gate .btn{background:#fff;color:#4A2675}
.gate .link{color:#E8DAF5}
.gate ol{padding-left:22px;margin:0 0 22px}
.gate li{margin-bottom:8px}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;font-size:15px}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0}
.err{color:#A81C49;font-weight:600;margin-bottom:12px}
.gate .err{color:#FFD0DC}

/* Tabs */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 10px);max-width:480px;margin:0 auto;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:32px;display:flex;padding:6px;z-index:5;box-shadow:0 8px 28px rgba(59,35,80,.16)}
.tabs button{flex:1;height:56px;font-size:13px;color:var(--soft);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .2s}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--accent);font-weight:700;background:var(--bg1)}

/* Blatt */
.back{position:fixed;inset:0;background:rgba(59,35,80,.38);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:linear-gradient(180deg,#fff,var(--bg2));border-radius:30px 30px 0 0;max-height:93dvh;overflow:auto;padding:22px 20px calc(var(--bot) + 24px);max-width:600px;margin:0 auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sh h2{font:400 27px/1.15 var(--serif)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:0 15px;border-radius:22px;background:var(--bg1);font-size:16px;transition:transform .12s}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed=true]{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff}

.res{display:grid;gap:8px}
.res button{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border-radius:18px;padding:11px 14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.res button[aria-pressed=true]{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--bg1)}
.res .strip{flex:none;height:36px;width:19px}
.res small{display:block;color:var(--soft);font-size:14px;line-height:1.3}
.prev{display:block;width:100%;max-height:240px;object-fit:contain;background:var(--line);border-radius:16px;margin-bottom:8px}
.dtest{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.light{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center}
.light img{max-width:100%;max-height:100%}
.timer{position:fixed;left:10px;right:10px;top:calc(var(--top) + 6px);z-index:30;background:linear-gradient(120deg,#7A3FE0,#C766E0);border-radius:24px;color:#fff;padding:7px 18px;display:flex;align-items:center;gap:12px;font-size:16px;box-shadow:0 8px 24px rgba(122,63,224,.35)}
.timer b{flex:1;font-variant-numeric:tabular-nums}
.timer button{color:#fff;text-decoration:underline;min-height:40px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<svg class="defs" aria-hidden="true"><defs>
<linearGradient id="g-stark" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#B0204F"/><stop offset="1" stop-color="#E8527F"/></linearGradient>
<linearGradient id="g-mittel" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#D93A68"/><stop offset="1" stop-color="#F57C9B"/></linearGradient>
<linearGradient id="g-leicht" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#F08CA8"/><stop offset="1" stop-color="#FBC1CF"/></linearGradient>
<linearGradient id="g-spot" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#F9C9D6"/><stop offset="1" stop-color="#FDE6EC"/></linearGradient>
<linearGradient id="g-fert" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#7A3FE0"/><stop offset="1" stop-color="#D27BEA"/></linearGradient>
<linearGradient id="g-plan" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#E8DCFF"/><stop offset="1" stop-color="#F8F3FF"/></linearGradient>
<linearGradient id="g-man" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1F7A8C"/><stop offset="1" stop-color="#5CC2A6"/></linearGradient>
<linearGradient id="g-fol" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#5FB795"/><stop offset="1" stop-color="#BDE6CF"/></linearGradient>
<linearGradient id="g-lut" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#7F8FDB"/><stop offset="1" stop-color="#C1C9F2"/></linearGradient>
</defs></svg>
<div id="app"></div>
<div id="sheet"></div>
<div id="timer"></div>
<noscript>Diese Seite braucht JavaScript.</noscript>
<script>
'use strict';
/* ---------- Grundlagen ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const num=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const str=n=>new Date(n*864e5).toISOString().slice(0,10);
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const df=o=>new Intl.DateTimeFormat('de-DE',{timeZone:'UTC',...o});
const fD=df({day:'numeric',month:'long'}), fS=df({day:'numeric',month:'short'}), fW=df({weekday:'long',day:'numeric',month:'long'}), fM=df({month:'long',year:'numeric'});
const f=n=>fD.format(new Date(n*864e5)), fs=n=>fS.format(new Date(n*864e5));
const FLOW={spot:'Schmierblutung',leicht:'Leicht',mittel:'Mittel',stark:'Stark'};
const RES={positiv:'Positiv',negativ:'Negativ',ungueltig:'Ungültig'};
const MUCUS=['Trocken','Klebrig','Cremig','Wässrig','Spinnbar'];
const SYM=['Krämpfe','Kopfschmerzen','Brustspannen','Müde','Übelkeit','Unterleib zieht','Gute Laune','Gereizt','Traurig','Lust'];
const ITER=600000;

/* ---------- Speicher: alles liegt nur in diesem Browser ---------- */
let dbP;
function db(){return dbP||(dbP=new Promise((ok,no)=>{const r=indexedDB.open('zyklus',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function tx(mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('kv',mode),s=t.objectStore('kv');let out;const r=fn(s);if(r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error)})}
const get=k=>tx('readonly',s=>s.get(k));
const put=(k,v)=>tx('readwrite',s=>s.put(v,k));
const del=k=>tx('readwrite',s=>s.delete(k));
const keys=()=>tx('readonly',s=>s.getAllKeys());
const wipeDb=()=>tx('readwrite',s=>s.clear());

/* ---------- Verschlüsselung: AES-256-GCM, Schlüssel aus dem Passwort ---------- */
const te=new TextEncoder(), td=new TextDecoder();
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function kek(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey']);
}
async function wrap(dek,pw){
  const salt=rnd(16),iv=rnd(12),k=await kek(pw,salt,ITER);
  return {v:1,salt,iter:ITER,iv,wrapped:new Uint8Array(await crypto.subtle.wrapKey('raw',dek,k,{name:'AES-GCM',iv}))};
}
async function unwrap(m,pw,extractable=false){
  const k=await kek(pw,m.salt,m.iter);
  return crypto.subtle.unwrapKey('raw',m.wrapped,k,{name:'AES-GCM',iv:m.iv},'AES-GCM',extractable,['encrypt','decrypt']);
}
async function enc(k,bytes){const iv=rnd(12);return {iv,ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes))}}
const dec=(k,b)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b.iv},k,b.ct);

/* ---------- Sitzung ---------- */
let bloomNext=true,settingsOpen=false,remembered=false;
let KEY=null,S=null,tab='heute',vy,vm,SHEET=null,TF=null,photoCache=new Map(),saveChain=Promise.resolve(),saveT=null,bk=null;
const blank=()=>({v:1,settings:{cycleLen:null},days:{},tests:[],lastBackup:null});
function persist(){
  clearTimeout(saveT);saveT=null;
  const k=KEY,snap=JSON.stringify(S);
  saveChain=saveChain.then(async()=>put('state',await enc(k,te.encode(snap)))).catch(e=>toastErr(e));
  return saveChain;
}
function persistSoon(){clearTimeout(saveT);saveT=setTimeout(persist,400)}
function toastErr(e){console.error(e);alert('Speichern hat nicht geklappt. Prüfe, ob auf dem Handy noch Speicherplatz frei ist.')}
async function loadState(){const b=await get('state');S=b?Object.assign(blank(),JSON.parse(td.decode(await dec(KEY,b)))):blank()}
async function lock(){
  if(saveT)persist();
  await saveChain;
  KEY=null;S=null;TF=null;SHEET=null;bk=null;
  photoCache.forEach(u=>URL.revokeObjectURL(u));photoCache.clear();
  $('#sheet').innerHTML='';tab='heute';bloomNext=true;setPhase(null);
  renderLogin();
}
let lastActive=Date.now(),hiddenAt=null,pickerUntil=0;
const picking=()=>Date.now()<pickerUntil;
['pointerdown','keydown','input'].forEach(e=>addEventListener(e,()=>lastActive=Date.now(),{passive:true}));
setInterval(()=>{if(KEY&&!remembered&&!picking()&&Date.now()-lastActive>5*6e4)lock()},15000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(KEY&&saveT)persist();return}
  if(KEY&&!remembered&&!picking()&&hiddenAt&&Date.now()-hiddenAt>2*6e4)lock();
  else if(KEY&&!SHEET)renderApp();
});

/* ---------- Auswertung ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const testStart=L=>L==null?5:clamp(L,21,40)-16; // Tabelle der Anleitung: 21 Tage = Tag 5 ... 40 Tage = Tag 24
function model(){
  const T=num(todayS());
  const flows=Object.entries(S.days).filter(([,d])=>['leicht','mittel','stark'].includes(d.flow)).map(([k])=>num(k)).sort((a,b)=>a-b);
  const starts=[];let prev=null;
  for(const d of flows){if(prev===null||(d-prev>2&&d-starts[starts.length-1]>=14))starts.push(d);prev=d}
  const tests=S.tests.map(t=>({...t,n:num(t.date)}));
  const cycles=starts.map((s,i)=>{
    const end=i<starts.length-1?starts[i+1]-1:null,upto=end??Infinity;
    const fl=flows.filter(d=>d>=s&&d<=upto&&d-s<12);
    const pos=tests.filter(t=>t.result==='positiv'&&t.n>=s&&t.n<=upto).map(t=>t.n).sort((a,b)=>a-b)[0]??null;
    return {start:s,end,len:end!=null?end-s+1:null,flows:fl,pos};
  });
  const done=cycles.filter(c=>c.len!=null&&c.len>=15&&c.len<=60).slice(-6);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const avgLen=avg(done.map(c=>c.len));
  const L=avgLen??null;
  const avgBleed=avg(cycles.slice(0,-1).slice(-6).map(c=>c.flows.length).filter(n=>n>0));
  const cur=cycles.filter(c=>c.start<=T).pop()||null;
  let nextStart=null,planFrom=null,planEnd=null;
  if(cur){
    if(L)nextStart=cur.start+L;
    planFrom=cur.start+testStart(L)-1;
    planEnd=planFrom+(L?9:19); if(nextStart!=null)planEnd=Math.min(planEnd,nextStart-1);
  }
  const fert=new Set();cycles.forEach(c=>{if(c.pos!=null)[0,1,2].forEach(i=>fert.add(c.pos+i))});
  const pred=new Set();
  if(nextStart!=null&&nextStart>T)for(let i=0;i<(avgBleed||5);i++)pred.add(nextStart+i);
  const cycleOf=n=>cycles.filter(c=>c.start<=n&&(c.end==null||c.end>=n)).pop()||null;
  return {T,cycles,cur,L,avgLen,avgBleed,nextStart,planFrom,planEnd,fert,pred,tests,cycleOf,done};
}
function bestResult(ts){for(const r of ['positiv','negativ','ungueltig'])if(ts.some(t=>t.result===r))return r;return null}
function dayInfo(m,n){
  const s=str(n),d=S.days[s]||{},ts=m.tests.filter(t=>t.n===n);
  const c=m.cycleOf(n),cd=c?n-c.start+1:null;
  let cl='';
  if(d.flow&&d.flow!=='spot')cl='f-'+d.flow;
  else if(d.flow==='spot')cl='f-spot';
  else if(m.fert.has(n))cl='fertd';
  else if(m.pred.has(n))cl='pred';
  else if(m.cur&&m.cur.pos==null&&n>=m.T&&n>=m.planFrom&&n<=m.planEnd)cl='plan';
  const lab=[f(n)];
  if(cd)lab.push('Zyklustag '+cd);
  if(d.flow)lab.push('Blutung: '+FLOW[d.flow]);
  if(d.sex)lab.push('Sex');
  const r=bestResult(ts);
  if(r)lab.push('Test '+RES[r]);
  if(m.fert.has(n))lab.push('besonders fruchtbar');
  if(m.pred.has(n))lab.push('Blutung erwartet');
  if(cl==='plan')lab.push('Testtag');
  return {s,d,ts,cd,cl,r,label:lab.join(', ')};
}
function statusOf(m){
  const c=m.cur;if(!c)return null;
  const T=m.T,ts=testStart(m.L),today=m.tests.filter(t=>t.n===T),r=bestResult(today);
  const when='Am besten zwischen 10 und 20 Uhr, nicht mit dem ersten Morgenurin. Etwa 2 Stunden vorher wenig trinken.';
  if(c.pos!=null&&T<=c.pos+2){
    if(T===c.pos)return{h:'Test positiv',d:`Eisprung wahrscheinlich in 24 bis 48 Stunden, also am ${f(T+1)} oder ${f(T+2)}.`,fert:1};
    return{h:'Besonders fruchtbare Tage',d:`Dein Test war am ${f(c.pos)} positiv. Eisprung wahrscheinlich am ${f(c.pos+1)} oder ${f(c.pos+2)}.`,fert:1};
  }
  const pt=pregTest(m);
  if(pt&&T>=pt.from){
    const o=T-pt.from;
    return{h:'Zeit für einen Schwangerschaftstest',d:(o?`Deine Periode ist seit ${o} ${o===1?'Tag':'Tagen'} fällig. `:'Heute wäre deine Periode fällig. ')+'Am aussagekräftigsten ist der Test mit dem ersten Morgenurin. Kommt die Blutung, trag sie einfach ein.'};
  }
  if(m.nextStart!=null&&T>=m.nextStart){
    const o=T-m.nextStart;
    return{h:o?`Blutung seit ${o} ${o===1?'Tag':'Tagen'} erwartet`:'Blutung heute erwartet',d:'Trag sie ein, sobald sie beginnt. Dann startet der nächste Zyklus.'};
  }
  if(pt){
    const dpo=T-pt.ov;
    return{h:`Tag ${dpo} nach dem Eisprung`,d:`Ein Schwangerschaftstest ist ab dem ${f(pt.from)} sinnvoll. Vorher kann er negativ sein, obwohl du schwanger bist.`,dpo};
  }
  if(T<m.planFrom)return{h:`Test ab ${f(m.planFrom)}`,d:m.L?`Das ist Zyklustag ${ts}, passend zu ${m.L} Tagen Zykluslänge.`:'Deine Zykluslänge ist noch unbekannt, deshalb startest du an Zyklustag 5.'};
  if(T<=m.planEnd){
    if(r==='negativ')return{h:'Heute negativ',d:'Morgen weiter testen, bis der Test positiv ist.'};
    if(r==='ungueltig')return{h:'Test ungültig',d:'Wiederhole ihn mit einem neuen Streifen.'};
    return{h:'Heute testen',d:when};
  }
  return{h:'Noch kein positiver Test',d:m.nextStart!=null?`Nächste Blutung etwa am ${f(m.nextStart)}.`:'Trag die nächste Blutung ein, sobald sie beginnt.'};
}

// Schwangerschaftstest: ab dem Tag, an dem die Periode fällig wäre (sonst etwa 14 Tage nach dem Eisprung)
function pregTest(m){
  const c=m.cur;if(!c||c.pos==null||m.T<=c.pos+2)return null;
  const ov=c.pos+1;
  return {ov,from:m.nextStart!=null&&m.nextStart>ov+9?m.nextStart:ov+14};
}

/* ---------- Bausteine ---------- */
function strip(r){
  const ctl=r==='ungueltig'?'':'<rect x="3.5" y="8" width="7" height="2.6" rx="1" fill="#3B2350"/>';
  const t=r==='positiv'?'<rect x="3.5" y="15" width="7" height="2.6" rx="1" fill="#7A3FE0"/>':r==='negativ'?'<rect x="3.5" y="15" width="7" height="2.6" rx="1" fill="#7A3FE0" opacity=".22"/>':'';
  return `<svg class="strip" viewBox="0 0 14 26" aria-hidden="true"><rect x=".75" y=".75" width="12.5" height="24.5" rx="5" fill="#fff" stroke="#3B2350" stroke-width="1.3"/>${ctl}${t}</svg>`;
}
const mark=i=>i.r==='positiv'?'<span class="mks">✦</span>':i.r==='negativ'?'<span class="mks n">•</span>':i.r?'<span class="mks n">×</span>':'<span class="mks"></span>';
// Phase eines Tages: bleed, fol, fert, lut oder null (noch offen). est = geschätzt
function dayPhase(m,c,n){
  if(!c)return {p:null};
  const fl=(S.days[str(n)]||{}).flow;
  if(fl&&fl!=='spot'||c.flows.includes(n))return {p:'bleed'};
  if(n>m.T&&n-c.start<(m.avgBleed||5)&&c.flows.length)return {p:'bleed',est:1};
  if(c.pos!=null){
    if(n>=c.pos&&n<=c.pos+2)return {p:'fert'};
    return {p:n>c.pos+2?'lut':'fol',est:n>m.T};
  }
  if(m.L){
    const ov=c.start+m.L-14;
    if(n>=ov-1&&n<=ov+1)return {p:'fert',est:1};
    return {p:n>ov+1?'lut':'fol',est:n>m.T||n>ov+1};
  }
  if(n>m.planEnd)return {p:null};
  return {p:'fol',est:n>m.T};
}
function phaseOf(m){const d=dayPhase(m,m.cur,m.T);return d.p||'fol'}
const PHASES={
  bleed:['Periode','🌙',1,'Energie niedrig','Vielleicht müde und empfindlich. Wärme, Ruhe und Kuscheldecke tun gut.'],
  fol:['Follikelphase','🌱',3,'Energie steigt','Oft motiviert, offen für Neues und gut gelaunt.'],
  fert:['Eisprung','☀️',4,'Energie hoch','Oft selbstbewusst, gesellig und mit mehr Lust.'],
  lut:['Lutealphase','🍂',2,'Energie sinkt langsam','Vielleicht mehr Appetit, sensibler und Lust auf Gemütlichkeit.']};
function phaseBar(m){
  const cur=dayPhase(m,m.cur,m.T).p;
  const items=['bleed','fol','fert','lut'].map(k=>`<li class="ph ph-${k} ${k===cur?'on':''}" ${k===cur?'aria-current="step"':''}><i></i>${PHASES[k][0]}</li>`).join('');
  if(!cur)return `<ol class="phases" aria-label="Phasen deines Zyklus">${items}</ol>`;
  const[,emo,lvl,head,feel]=PHASES[cur];
  const bars=[1,2,3,4].map(i=>`<i class="${i<=lvl?'f':''}"></i>`).join('');
  return `<ol class="phases" aria-label="Phasen deines Zyklus">${items}</ol>
  <div class="mood"><span class="emo" aria-hidden="true">${emo}</span><div><b>${head}</b> <span class="en" role="img" aria-label="Energie ${lvl} von 4">${bars}</span><p>${feel}</p></div></div>`;
}
const PHASE_TOP={bleed:'#FFD9E3',fol:'#D4F2E4',fert:'#E6D6FF',lut:'#DBE2FB',man:'#D3ECF5'};
function setPhase(p){
  if(p)document.body.dataset.phase=p;else delete document.body.dataset.phase;
  $('meta[name=theme-color]').content=p?PHASE_TOP[p]:'#2F1A4A';
}
function petalClass(m,c,n,inf){
  const fl=inf.d.flow;
  if(fl&&n<=m.T)return fl==='spot'?'b-spot':'b-'+fl;
  if(n>=m.T&&inf.cl==='plan')return 'plan';
  const d=dayPhase(m,c,n);
  if(!d.p)return 'fut';
  const k={bleed:'b-mittel',fol:'fol',fert:'fertile',lut:'lut'}[d.p];
  return k+(d.est&&n>m.T?' est':'');
}
function petalPath(N){
  const r0=58,r1=174,L=r1-r0,w=Math.min(38,(2*Math.PI*118/N)/2*1.35);
  return `M180 ${180-r0} C${(180+w).toFixed(1)} ${(180-r0-L*.32).toFixed(1)} ${(180+w*.9).toFixed(1)} ${(180-r1+L*.2).toFixed(1)} 180 ${180-r1} C${(180-w*.9).toFixed(1)} ${(180-r1+L*.2).toFixed(1)} ${(180-w).toFixed(1)} ${(180-r0-L*.32).toFixed(1)} 180 ${180-r0}Z`;
}
function flowerPlain(cls,label){
  const d=petalPath(28);let g='';
  for(let i=0;i<28;i++)g+=`<g transform="rotate(${(i*360/28).toFixed(2)} 180 180)"><path class="p fut" d="${d}"/></g>`;
  return `<svg class="fl ${cls}" viewBox="0 0 360 360" aria-hidden="true">${g}${label||''}</svg>`;
}
function flower(m,c,N,opt={}){
  const d=petalPath(N);let g='',last='';
  for(let i=0;i<N;i++){
    const n=c.start+i,inf=dayInfo(m,n),cls=petalClass(m,c,n,inf),today=!opt.mini&&n===m.T,a=(i*360/N).toFixed(2);
    const act=opt.mini?'':`data-a="day" data-v="${inf.s}" role="button" tabindex="0" aria-label="${esc(inf.label)}"`;
    const mk=inf.r==='positiv'?`<path class="mk" style="--i:${i}" fill="#FFC83D" stroke="#fff" stroke-width=".8" d="M180 24 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2z"/>`:inf.r==='negativ'?`<circle class="mk" style="--i:${i}" cx="180" cy="36" r="3" fill="#fff"/>`:'';
    const part=`<g transform="rotate(${a} 180 180)"><path class="p ${cls} ${today?'today':''}" style="--i:${i}" d="${d}" ${act}/>${mk}</g>`;
    if(today)last=part;else g+=part;

function lineAt(cv,x,y,dir){
  const W=cv.width,H=cv.height,ctx=cv.getContext('2d',{willReadFrequently:true});
  const along=dir==='v'?W:H,across=dir==='v'?H:W;
  const w=Math.max(8,Math.round(along*.03)),h=Math.max(3,Math.round(across*.025));
  const p=dir==='v'?x:y,q=dir==='v'?y:x;
  const a0=Math.max(0,p-w),a1=Math.min(along-1,p+w),b0=Math.max(0,q-h),b1=Math.min(across-1,q+h);
  const img=dir==='v'?ctx.getImageData(a0,b0,a1-a0+1,b1-b0+1):ctx.getImageData(b0,a0,b1-b0+1,a1-a0+1);
  const prof=[];
  for(let i=0;i<=a1-a0;i++){let sum=0,n=0;
    for(let j=0;j<=b1-b0;j++){const k=dir==='v'?(j*img.width+i)*4:(i*img.width+j)*4;sum+=img.data[k+1];n++}
    prof.push(sum/n)}
  let mi=0;prof.forEach((v,i)=>{if(v<prof[mi])mi=i});
  const sorted=prof.slice().sort((a,b)=>a-b),bg=sorted[Math.floor(sorted.length*.75)];
  return {d:Math.max(0,bg-prof[mi]),pos:a0+mi};
}

let mCanvas=null;
async function measureTap(img,ev){
  const t=TF,rect=img.getBoundingClientRect();
  const fx=(ev.clientX-rect.left)/rect.width,fy=(ev.clientY-rect.top)/rect.height;
  if(!mCanvas||mCanvas.src!==img.src){
    const cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;
    cv.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0);cv.src=img.src;mCanvas=cv;
  }
  const cv=mCanvas,x=Math.round(fx*cv.width),y=Math.round(fy*cv.height);
  if(t.mstep===1){
    const v=lineAt(cv,x,y,'v'),h=lineAt(cv,x,y,'h'),dir=v.d>=h.d?'v':'h',l=dir==='v'?v:h;
    if(l.d<12){t.merr='Hier ist keine deutliche Linie. Tippe genau auf die Kontrolllinie.';renderSheet();return}
    t.mC={d:l.d,dir};t.marks=[dir==='v'?{x:l.pos/cv.width,y:fy}:{x:fx,y:l.pos/cv.height}];t.mstep=2;t.merr='';renderSheet();return;
  }
  const l=lineAt(cv,x,y,t.mC.dir);
  const ratio=Math.min(3,Math.round(l.d/t.mC.d*100)/100);
  t.marks.push(t.mC.dir==='v'?{x:(l.d<4?x:l.pos)/cv.width,y:fy}:{x:fx,y:(l.d<4?y:l.pos)/cv.height});
  t.ratio=ratio;t.measured=true;t.mstep=0;t.merr='';
  if(!t.result)t.result=ratio>=1?'positiv':'negativ';
  renderSheet();
}

async function photoUrl(id){
  if(photoCache.has(id))return photoCache.get(id);
  const b=await get('photo:'+id);if(!b)return null;

}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}
}

    KEY=dek;await loadState();if(remembered)await remember(true,dek);SHEET=null;$('#sheet').innerHTML='';tab='heute';bloomNext=true;lastActive=Date.now();renderApp();
  },
  async login(form){
    const b=$('button[type=submit]',form),pw=$('#lp').value;b.disabled=true;b.textContent='Wird geöffnet';
    try{KEY=await unwrap(await get('meta'),pw)}catch{loginErr='Das Passwort stimmt nicht.';renderLogin();return}
    const rm=$('#rm').checked;loginErr='';await loadState();await remember(rm,KEY);bloomNext=true;lastActive=Date.now();hiddenAt=null;renderApp();
  },
  async setup(form){
    const p1=$('#s1').value,p2=$('#s2').value,c=$('#sc').checked,rm=$('#rm').checked;
    const err=m=>{setupErr=m;renderSetup()};
    if(p1.length<8)return err('Das Passwort braucht mindestens 8 Zeichen.');
    if(p1!==p2)return err('Die beiden Passwörter stimmen nicht überein.');
    if(!c)return err('Bestätige bitte, dass du dir das Passwort merkst.');
    const b=$('button[type=submit]',form);b.disabled=true;b.textContent='Wird eingerichtet';
    const dek=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
    const meta=await wrap(dek,p1);
    await put('meta',meta);
    KEY=await unwrap(meta,p1);S=blank();S.role=setupRole;if(setupRole==='mann'){S.manStart=todayS();S.supps=[]}await persist();await remember(rm,KEY);bloomNext=true;tab='heute';
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    setupErr='';lastActive=Date.now();renderApp();if(setupRole!=='mann')openSheet({t:'first'});
  },
};
document.addEventListener('submit',e=>{
  const form=e.target,n=form.dataset.f;if(!n)return;e.preventDefault();
  Promise.resolve(F[n](form)).catch(err=>{console.error(err);alert('Das hat nicht geklappt. Bitte versuch es noch einmal.')});
});

async function remember(on,k){remembered=false;if(!on){await del('remember');return}try{await put('remember',k);remembered=true}catch(e){console.error(e)}}
let loginErr='',setupErr='',skipInstall=false,setupRole='frau';
const bigStrip=`<div class="gatefl">${flowerPlain('')}</div>`;
function gate(html){setPhase(null);$('#app').innerHTML=`<div class="gate"><div class="in">${bigStrip}${html}</div></div>`}
function renderLogin(){
  gate(`<h1>Zyklus</h1><p>Gib dein Passwort ein, um deine Einträge zu öffnen.</p>
  <form data-f="login" novalidate>
   <input type="text" autocomplete="username" value="Zyklus" hidden>
   <label class="f"><span>Passwort</span><input type="password" id="lp" autocomplete="current-password" autofocus></label>
   <label class="check"><input type="checkbox" id="rm" checked><span>Auf diesem Gerät angemeldet bleiben</span></label>
   ${loginErr?`<p class="err" role="alert">${esc(loginErr)}</p>`:''}
   <button class="btn full" type="submit">Anmelden</button>
  </form>
  <p style="margin-top:22px" class="small">Passwort vergessen? Niemand kann es zurücksetzen. Du kannst nur neu anfangen oder ein Backup mit seinem Passwort einspielen.</p>
  <div class="row"><button class="link" data-a="wipe">Neu anfangen</button><button class="link" data-a="restore">Backup einspielen</button></div>`);
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function renderInstall(){
  gate(`<h1>Erst aufs Handy holen</h1><p>Auf dem iPhone speichert der Home-Bildschirm getrennt von Safari. Richte die Seite deshalb dort ein, sonst findest du deine Einträge später nicht wieder.</p>
  <ol><li>Tippe in Safari auf das Teilen-Symbol.</li><li>Wähle „Zum Home-Bildschirm“ und bestätige.</li><li>Öffne „Zyklus“ auf deinem Home-Bildschirm und leg dort dein Passwort fest.</li></ol>
  <button class="link" data-a="skipinstall">Nur im Browser ausprobieren</button>`);
}
function renderSetup(){
  gate(`<h1>Zyklus</h1><p>Wer nutzt die Seite auf diesem Handy?</p>
  <div class="roles" role="radiogroup" aria-label="Wer nutzt die Seite?">
   <button type="button" role="radio" aria-checked="${setupRole==='frau'}" data-a="setrole" data-v="frau"><span aria-hidden="true">🌸</span><b>Ich, mit Zyklus</b><small>Periode, Ovulationstests und fruchtbare Tage</small></button>
   <button type="button" role="radio" aria-checked="${setupRole==='mann'}" data-a="setrole" data-v="mann"><span aria-hidden="true">🌿</span><b>Mein Partner</b><small>Tipps für gesunde Spermien und tägliches Abhaken</small></button>
  </div>
  <p>Leg ein Passwort fest. Damit werden alle Einträge verschlüsselt, und sie bleiben auf diesem Gerät.</p>
  <form data-f="setup" novalidate>
   <input type="text" autocomplete="username" value="Zyklus" hidden>
   <label class="f"><span>Passwort, mindestens 8 Zeichen</span><input type="password" id="s1" autocomplete="new-password"></label>
   <label class="f"><span>Passwort wiederholen</span><input type="password" id="s2" autocomplete="new-password"></label>
   <label class="check"><input type="checkbox" id="sc"><span>Ich weiß: Wenn ich das Passwort vergesse, kann niemand meine Daten wiederherstellen.</span></label>
   <label class="check"><input type="checkbox" id="rm" checked><span>Auf diesem Gerät angemeldet bleiben</span></label>
   ${setupErr?`<p class="err" role="alert">${esc(setupErr)}</p>`:''}
   <button class="btn full" type="submit">Passwort festlegen</button>
  </form>
  <button class="link" style="margin-top:16px" data-a="restore">Ich habe schon ein Backup</button>`);
}
async function boot(){
  try{
    if(!window.crypto||!crypto.subtle||!window.indexedDB)throw new Error('unsupported');
    const m=await get('meta');
    if(m){
      const k=await get('remember');
      if(k){try{KEY=k;await loadState();remembered=true;renderApp();return}catch(e){console.error(e);KEY=null;S=null;remembered=false;await del('remember')}}
    }
    if(m)renderLogin();else if(isIOS&&!standalone&&!skipInstall)renderInstall();else renderSetup();
  }catch(e){console.error(e);$('#app').innerHTML='<div class="gate"><div class="in"><h1>Zyklus</h1><p>Dieser Browser kann hier nichts speichern. Öffne die Seite in Safari oder Chrome und nicht im privaten Modus.</p></div></div>'}
}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
